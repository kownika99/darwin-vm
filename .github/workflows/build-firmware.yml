name: Build Darwin-VM Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install jq
          IPSW_VER="v3.1.729"
          curl -fsSL "https://github.com/blacktop/ipsw/releases/download/${IPSW_VER}/ipsw_${IPSW_VER#v}_macOS_arm64.tar.gz" -o /tmp/ipsw.tar.gz
          tar -xzf /tmp/ipsw.tar.gz -C /tmp
          sudo install -m755 /tmp/ipsw /usr/local/bin/ipsw
          ipsw version

      - name: Download iOS sysroot
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/jprx/ios-cli-tools/main/prebuilt.tar.gz" \
            -o ios_sysroot.tar.gz

      - name: Find IPSW URL for iPhone14,2 iOS 26.6.1
        run: |
          URL=$(curl -s "https://api.ipsw.me/v4/device/iPhone14,2?type=ipsw" \
            | python3 -c "
import json,sys
data=json.load(sys.stdin)
for fw in data.get('firmwares',[]):
    v=fw.get('version','')
    if v.startswith('26.6'):
        print(fw['url']); break
" 2>/dev/null || true)
          echo "IPSW_URL=${URL}" >> $GITHUB_ENV
          echo "Found: ${URL}"

      - name: Build firmware
        run: DEVNAME="iPhone14,2" URL="${IPSW_URL}" ./get_files.sh

      - name: Fix permissions
        run: echo y | ./fix_perms.sh firmware/ramdisk.dmg

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: darwin-vm-firmware-iPhone14-2-ios26
          path: |
            firmware/bootkc
            firmware/dtree
            firmware/sptm
            firmware/txm
            firmware/ramdisk.dmg
            firmware/ramdisk.tc
          retention-days: 7
