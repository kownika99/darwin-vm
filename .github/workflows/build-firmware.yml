name: Build Darwin-VM Firmware

on:
  workflow_dispatch:
    inputs:
      devname:
        description: 'Device name (e.g. iPhone14,2)'
        required: true
        default: 'iPhone14,2'
      ios_version:
        description: 'iOS version (e.g. 26.6.1)'
        required: true
        default: '26.6.1'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install jq
          IPSW_VER="v3.1.729"
          curl -fsSL "https://github.com/blacktop/ipsw/releases/download/${IPSW_VER}/ipsw_${IPSW_VER#v}_macOS_arm64.tar.gz" -o /tmp/ipsw.tar.gz
          tar -xzf /tmp/ipsw.tar.gz -C /tmp
          sudo install -m755 /tmp/ipsw /usr/local/bin/ipsw
          ipsw version

      - name: Download iOS sysroot (prebuilt)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/jprx/ios-cli-tools/main/prebuilt.tar.gz" \
            -o ios_sysroot.tar.gz
          echo "sysroot size: $(du -sh ios_sysroot.tar.gz)"

      - name: Find IPSW URL
        run: |
          URL=$(ipsw download ipsw \
            --device "${{ inputs.devname }}" \
            --version "${{ inputs.ios_version }}" \
            --urls 2>/dev/null | grep "https://" | head -1 | tr -d ' ' || true)
          if [[ -z "$URL" ]]; then
            # fallback: query ipsw.me API
            URL=$(curl -s "https://api.ipsw.me/v4/device/${{ inputs.devname }}?type=ipsw" \
              | python3 -c "
import json,sys
data=json.load(sys.stdin)
for fw in data.get('firmwares',[]):
    if fw.get('version','').startswith('${{ inputs.ios_version }}'):
        print(fw['url']); break
" 2>/dev/null || true)
          fi
          if [[ -z "$URL" ]]; then
            echo "ERROR: could not find IPSW URL for ${{ inputs.devname }} ${{ inputs.ios_version }}"
            exit 1
          fi
          echo "Found URL: $URL"
          echo "IPSW_URL=${URL}" >> $GITHUB_ENV

      - name: Build firmware
        run: |
          DEVNAME="${{ inputs.devname }}" URL="${IPSW_URL}" ./get_files.sh

      - name: Fix permissions
        run: |
          echo y | ./fix_perms.sh firmware/ramdisk.dmg

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-vm-firmware-${{ inputs.devname }}-ios${{ inputs.ios_version }}
          path: |
            firmware/bootkc
            firmware/dtree
            firmware/sptm
            firmware/txm
            firmware/ramdisk.dmg
            firmware/ramdisk.tc
          retention-days: 7
